spring.application.name=employee-performance
# H2 In-Memory Database (no Docker needed)
spring.datasource.url=jdbc:h2:file:./data/hrdb;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway (H2 will auto-create tables from JPA entities)
spring.flyway.enabled=false

# H2 Console (browser UI at http://localhost:8080/h2-console)
spring.h2.console.enabled=true

server.port=8080